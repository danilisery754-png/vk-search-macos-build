name: Verify and Build VK Search v0.4.9 on GitHub-Hosted Mac ARM64

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: vk-search-v049-github-hosted-release
  cancel-in-progress: true

jobs:
  test-build-release:
    runs-on: macos-14
    timeout-minutes: 180
    steps:
      - name: Checkout clean v0.4.9 source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'
          cache: pip
          cache-dependency-path: v047_source/backend/pyproject.toml

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: v047_source/frontend/package-lock.json

      - name: Verify native Apple Silicon runner
        run: |
          test "$(uname -s)" = 'Darwin'
          test "$(uname -m)" = 'arm64'
          sw_vers
          python --version
          node --version


      - name: Restore generated image assets
        working-directory: v047_source
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path

          encoded = Path('build/vk-search-icon.jpg.b64').read_text(encoding='utf-8').strip()
          raw = base64.b64decode(encoded, validate=True)
          if len(raw) < 10_000 or not raw.startswith(b'\xff\xd8'):
              raise SystemExit('VK Search icon source is invalid')
          for target_name in ('build/vk-search-icon.jpg', 'frontend/public/vk-search-icon.jpg'):
              target = Path(target_name)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(raw)
          print(f'restored icon bytes: {len(raw)}')
          PY
          sips -s format png -z 1024 1024 build/vk-search-icon.jpg --out build/app-icon.png >/dev/null
          test -s frontend/public/vk-search-icon.jpg
          test -s build/app-icon.png

      - name: Install backend dependencies
        working-directory: v047_source
        run: |
          rm -rf .ci-venv
          python -m venv .ci-venv
          .ci-venv/bin/python -m pip install --upgrade pip
          .ci-venv/bin/python -m pip install -e './backend[dev,desktop]'
          .ci-venv/bin/python -m pip check

      - name: Verify v0.4.9 release metadata
        working-directory: v047_source
        run: |
          grep -q 'version = "0.4.9"' backend/pyproject.toml
          grep -q 'title="VK Search", version="0.4.9"' backend/app/main.py
          grep -q '"version": "0.4.9"' backend/app/api/routes.py
          grep -q '"version": "0.4.9"' frontend/package.json
          grep -q '<title>VK Search</title>' frontend/index.html
          grep -q 'APP_TITLE = "VK Search"' desktop/main.py
          grep -q 'name="VK Search.app"' build/VKOutreachManagerMac.spec
          grep -q 'version="0.4.9"' build/VKOutreachManagerMac.spec
          grep -q 'bundle_identifier="com.vkoutreach.manager"' build/VKOutreachManagerMac.spec
          grep -q 'VK_Search_0.4.9_macOS_arm64.dmg' build/BUILD_MACOS.sh
          test -s build/vk-search-icon.jpg.b64
          test -s frontend/public/vk-search-icon.jpg

      - name: v0.4.9 focused contracts
        working-directory: v047_source
        run: |
          .ci-venv/bin/python -m pytest \
            backend/tests/test_v049_behavior.py \
            backend/tests/test_v049_unread_semantics.py \
            backend/tests/test_v049_versioning.py \
            backend/tests/test_v049_static_assets.py \
            backend/tests/test_v049_preview_upgrade.py \
            backend/tests/test_v049_archive_sync.py \
            backend/tests/test_v049_routes.py \
            backend/tests/test_v049_migration_upgrade.py \
            backend/tests/test_v049_deleted_preview_runtime.py \
            backend/tests/test_v049_desktop_layout_contract.py \
            backend/tests/test_v049_hosted_workflow.py \
            backend/tests/test_v048_behavior.py \
            backend/tests/test_v047_critical_behavior.py \
            backend/tests/test_v047_product_contract.py \
            -q

      - name: Compile current backend and desktop sources
        working-directory: v047_source
        run: .ci-venv/bin/python -m compileall -q backend/app desktop

      - name: Normalize generated lockfile version metadata in runner workspace
        working-directory: v047_source/frontend
        run: |
          node <<'NODE'
          const fs = require('fs')
          const path = 'package-lock.json'
          const lock = JSON.parse(fs.readFileSync(path, 'utf8'))
          lock.version = '0.4.9'
          lock.packages[''].version = '0.4.9'
          fs.writeFileSync(path, JSON.stringify(lock, null, 2) + '\n')
          NODE
          node -e "const p=require('./package-lock.json'); if(p.version!=='0.4.9'||p.packages[''].version!=='0.4.9') process.exit(1)"

      - name: Frontend tests, typecheck and production build
        working-directory: v047_source/frontend
        run: |
          npm ci
          npm test
          npm run typecheck
          npm run build

      - name: Verify production frontend output
        working-directory: v047_source/frontend
        run: |
          ! grep -q '/src/main.tsx' dist/index.html
          ! grep -R -E 'fonts\.googleapis\.com|fonts\.gstatic\.com' dist
          grep -E -q '(src|href)="/assets/' dist/index.html
          grep -q '<title>VK Search</title>' dist/index.html
          test -s dist/vk-search-icon.jpg

      - name: Prepare packaged application icon
        working-directory: v047_source
        run: |
          .ci-venv/bin/python - <<'PY'
          import base64
          from pathlib import Path

          source = Path('build/vk-search-icon.jpg.b64')
          target = Path('build/vk-search-icon.jpg')
          raw = base64.b64decode(source.read_text(encoding='utf-8').strip(), validate=True)
          if len(raw) < 10_000 or not raw.startswith(b'\xff\xd8'):
              raise SystemExit('VK Search icon source is invalid')
          target.write_bytes(raw)
          print(f'icon bytes: {len(raw)}')
          PY
          sips -s format png -z 1024 1024 build/vk-search-icon.jpg --out build/app-icon.png >/dev/null
          test "$(sips -g pixelWidth build/app-icon.png | awk '/pixelWidth/{print $2}')" = '1024'
          test "$(sips -g pixelHeight build/app-icon.png | awk '/pixelHeight/{print $2}')" = '1024'

      - name: Build and self-test frozen macOS application
        working-directory: v047_source
        env:
          PYTHON_BIN: ${{ github.workspace }}/v047_source/.ci-venv/bin/python
        run: bash build/BUILD_MACOS.sh

      - name: Verify macOS ARM64 v0.4.9 release artifacts
        working-directory: v047_source
        run: |
          APP='build/dist-macos/VK Search.app'
          BIN="$APP/Contents/MacOS/VK Search"
          DMG='build/release/VK_Search_0.4.9_macOS_arm64.dmg'
          test -d "$APP"
          test -x "$BIN"
          test -f "$DMG"
          test -f "$DMG.sha256"
          file "$BIN" | grep -q 'arm64'
          test "$(plutil -extract CFBundleDisplayName raw "$APP/Contents/Info.plist")" = 'VK Search'
          test "$(plutil -extract CFBundleIdentifier raw "$APP/Contents/Info.plist")" = 'com.vkoutreach.manager'
          test "$(plutil -extract CFBundleShortVersionString raw "$APP/Contents/Info.plist")" = '0.4.9'
          codesign --verify --deep --strict --verbose=2 "$APP"
          hdiutil verify "$DMG"
          (cd build/release && shasum -a 256 -c VK_Search_0.4.9_macOS_arm64.dmg.sha256)
          du -sh "$APP" "$DMG"

      - name: Publish GitHub release v0.4.9 without gh CLI
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          from __future__ import annotations

          import http.client
          import json
          import os
          import subprocess
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path

          token = os.environ['GITHUB_TOKEN']
          repository = os.environ['GITHUB_REPOSITORY']
          api = f'https://api.github.com/repos/{repository}'
          tag = 'v0.4.9'
          target = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          notes = (
              'VK Search 0.4.9 for macOS ARM64. Includes exact WebView viewport sizing, '
              'saved work-area scaling, robust VK Search sidebar icon, compact messenger '
              'composer controls, visual account ordering, local dialog archive and accurate '
              'last-message previews. Existing sender/outreach behavior and local data identity '
              'are preserved.'
          )
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'vk-search-v049-github-hosted',
          }

          def api_request(method: str, url: str, payload=None, *, allow_404: bool = False):
              data = None
              request_headers = dict(headers)
              if payload is not None:
                  data = json.dumps(payload).encode('utf-8')
                  request_headers['Content-Type'] = 'application/json'
              request = urllib.request.Request(url, data=data, headers=request_headers, method=method)
              try:
                  with urllib.request.urlopen(request, timeout=60) as response:
                      raw = response.read()
              except urllib.error.HTTPError as exc:
                  if allow_404 and exc.code == 404:
                      return None
                  detail = exc.read().decode('utf-8', errors='replace')
                  raise RuntimeError(f'GitHub API {method} {url} failed: {exc.code} {detail}') from exc
              return json.loads(raw.decode('utf-8')) if raw else None

          release = api_request(
              'GET',
              f'{api}/releases/tags/{urllib.parse.quote(tag)}',
              allow_404=True,
          )
          if release is None:
              release = api_request(
                  'POST',
                  f'{api}/releases',
                  {
                      'tag_name': tag,
                      'target_commitish': target,
                      'name': 'VK Search 0.4.9',
                      'body': notes,
                      'draft': False,
                      'prerelease': False,
                  },
              )
          release_id = int(release['id'])
          assets = api_request('GET', f'{api}/releases/{release_id}/assets?per_page=100') or []

          paths = [
              Path('v047_source/build/release/VK_Search_0.4.9_macOS_arm64.dmg'),
              Path('v047_source/build/release/VK_Search_0.4.9_macOS_arm64.dmg.sha256'),
          ]
          for path in paths:
              if not path.is_file():
                  raise RuntimeError(f'Missing release asset: {path}')
              for asset in assets:
                  if asset.get('name') == path.name:
                      api_request('DELETE', f"{api}/releases/assets/{int(asset['id'])}")

              upload_path = (
                  f'/repos/{repository}/releases/{release_id}/assets?'
                  f'name={urllib.parse.quote(path.name)}'
              )
              connection = http.client.HTTPSConnection('uploads.github.com', timeout=600)
              try:
                  connection.putrequest('POST', upload_path)
                  connection.putheader('Authorization', f'Bearer {token}')
                  connection.putheader('Accept', 'application/vnd.github+json')
                  connection.putheader('X-GitHub-Api-Version', '2022-11-28')
                  connection.putheader('User-Agent', 'vk-search-v049-github-hosted')
                  connection.putheader('Content-Type', 'application/octet-stream')
                  connection.putheader('Content-Length', str(path.stat().st_size))
                  connection.endheaders()
                  with path.open('rb') as source:
                      while True:
                          chunk = source.read(1024 * 1024)
                          if not chunk:
                              break
                          connection.send(chunk)
                  response = connection.getresponse()
                  detail = response.read().decode('utf-8', errors='replace')
                  if response.status not in (200, 201):
                      raise RuntimeError(
                          f'GitHub asset upload failed for {path.name}: '
                          f'{response.status} {detail}'
                      )
              finally:
                  connection.close()
              print(f'uploaded {path.name}')
          PY
